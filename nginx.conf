server {
    listen 80;
    listen [::]:80;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Without this a refresh on /users/5 returns 404: there is no such file on disk. Anything
    # that is not a file goes to index.html and the router in the browser decides from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a hash in every asset filename, so content under a given name never changes.
    # One header, not `expires` plus `add_header`: that idiom sends Cache-Control twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must NOT be cached, otherwise after a deploy the user gets the old page asking
    # for assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Container-local liveness probe. Used by the compose healthcheck and by deploy.sh, which
    # waits for it before declaring the deploy done. Never reachable from outside: no ports are
    # published and Traefik only routes the app's own domain here.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

# Compression is Traefik's job (`compress@file` in the labels). Doing it here too would
# compress twice.
